def svcVersion = findProperty('svc_version')
if (svcVersion) {
    repositories {
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
    }
    def notation = "maven.modrinth:simple-voice-chat:${svcVersion}"
    def hasConfig = { String name -> configurations.findByName(name) != null }
    def forgeGradle = project.extensions.findByName('fg')
    def deobf = forgeGradle != null && forgeGradle.metaClass.respondsTo(forgeGradle, 'deobf')
    dependencies {
        if (deobf) {
            compileOnly forgeGradle.deobf(notation)
            runtimeOnly forgeGradle.deobf(notation)
        } else if (hasConfig('modCompileOnly')) {
            modCompileOnly notation
            modLocalRuntime notation
        } else {
            compileOnly notation
            if (hasConfig('localRuntime')) {
                localRuntime notation
            } else {
                runtimeOnly notation
            }
        }
    }
}
if (!svcVersion) {
    sourceSets.main.java.exclude('**/client/svc/**')
}
