plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = findProperty('mod_version') ?: '1.1.0'
group = 'com.github.olympus.proteus'

java.toolchain.languageVersion = JavaLanguageVersion.of(proteus_java.toInteger())

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'proteus'

            args '--mixin.config', 'proteus.mixins.json'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'proteus', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes 'MixinConfigs': 'proteus.mixins.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def forgeModVersion = project.version.toString()

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', forgeModVersion
    filesMatching('META-INF/mods.toml') {
        expand(mod_version: forgeModVersion)
    }
}

ext.proteusPublish = [
    loader: 'forge',
    label: proteus_label,
    java: proteus_java.toInteger(),
    requires: [],
    jar: { tasks.jar.archiveFile }
]
apply from: 'svc.gradle'
apply from: 'ji.gradle'
apply from: 'publish.gradle'
